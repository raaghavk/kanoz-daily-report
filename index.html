<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/kanoz-icon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2d6a4f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/kanoz-logo.png" />

  <!-- Preconnect to critical origins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://coguzmhpfmjkxmuasuoj.supabase.co" />
  <link rel="dns-prefetch" href="https://coguzmhpfmjkxmuasuoj.supabase.co" />

  <!-- Fonts: only load weights we actually use, with display=swap -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

  <title>Kanoz Daily Report</title>

  <!-- Inline critical CSS for instant first paint -->
  <style>
    body { margin: 0; font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif; background: #fefae0; }
    #root { height: 100dvh; }
    .app-loader { display: flex; align-items: center; justify-content: center; height: 100dvh; background: #fefae0; }
    .app-loader-spinner { width: 32px; height: 32px; border: 3px solid #2d6a4f; border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root">
    <!-- Shows instantly while JS loads -->
    <div class="app-loader"><div class="app-loader-spinner"></div></div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
